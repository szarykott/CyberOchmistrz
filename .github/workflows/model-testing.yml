name: Model testing campaigns

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Budget per engine in seconds (1–3600)'
        default: '600'
        required: true
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        engine: [properties, fuzz, mutation]
    concurrency:
      group: model-testing-${{ github.ref }}-${{ matrix.engine }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        if: matrix.engine == 'fuzz'
        with:
          path: .model-testing/corpus
          key: model-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: model-corpus-${{ runner.os }}-
      - name: Run campaign
        env:
          CAMPAIGN_SECONDS: ${{ inputs.seconds || '3600' }}
          CAMPAIGN_ENGINE: ${{ matrix.engine }}
        run: |
          if ! [[ "$CAMPAIGN_SECONDS" =~ ^[0-9]+$ ]] || (( CAMPAIGN_SECONDS < 1 || CAMPAIGN_SECONDS > 3600 )); then
            echo 'seconds must be an integer between 1 and 3600'
            exit 2
          fi
          npm run test:model -- --engine "$CAMPAIGN_ENGINE" --seconds "$CAMPAIGN_SECONDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-testing-${{ matrix.engine }}
          path: reports/model-testing/
          retention-days: 30
